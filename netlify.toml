[build]
  command = "npx convex deploy --cmd-url-env-var-name VITE_CONVEX_URL --cmd 'bun run build'"
  publish = "dist"

[build.environment]
  # Convex >= 1.39 requires Node 22, and Vite 8 wants ^20.19 || >=22.12, so 22
  # is the lowest version that satisfies both. Node 20 fails the build at
  # `convex deploy` before Vite ever runs.
  NODE_VERSION = "22"

# Previews build the frontend only — they must never run `convex deploy`, which
# would push a pull request's schema and functions to production. They instead
# point at the dev Convex deployment and the Clerk development instance, set as
# deploy-preview-scoped variables in the Netlify UI:
#
#   VITE_CONVEX_URL            https://<dev>.convex.cloud
#   VITE_CLERK_PUBLISHABLE_KEY pk_test_...
#
# Without those two, the build still succeeds and the published preview shows
# the "not configured" screen from src/main.tsx.
[context.deploy-preview]
  command = "bun run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
