<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Hour tracking for Deceivers Robotics, FRC Team 4392."
    />
    <title>Deceivers Robotics – Team 4392</title>
    <script>
      // Applies the stored theme before first paint. next-themes only runs
      // after hydration, so without this a dark-mode kiosk flashed white on
      // every load. Keep the storage key and class in step with the
      // ThemeProvider in src/main.tsx.
      ;(function () {
        try {
          var stored = localStorage.getItem("theme")
          var theme =
            stored && stored !== "system"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          if (theme === "dark") document.documentElement.classList.add("dark")
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* private mode or blocked storage — fall back to the default theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
